  "请给出依据和出处",
  "A和B的区别是什么？",
  "这个产品/方案/接口有哪些特点？",
  "是否支持某个功能/选项？规则是什么？",
  "对比两款产品/方案：分别概述它们的主要特点（至少各3点）。",
  "请给出门槛/条件/限制，并说明对应规则。",
  "请分析一下X的优缺点/优劣，并给出依据",
  "请评价一下X有哪些优势与劣势（基于资料）",
  "分析一下X的特点、优点和不足",
