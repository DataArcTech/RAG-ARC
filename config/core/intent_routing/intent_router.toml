# Intent routing configuration (semantic embedding router)
#
# Notes
# - This file is intended to be edited to improve routing quality over time.
# - Secrets/endpoints should be referenced via ${ENV_VAR} placeholders.
# - Intent embeddings are decoupled from RAG embeddings.

[intent_router]
enabled = true

# If no intent route passes its threshold, we fall back to this intent.
default_intent = "RAG_REQUIRED"

# Router behavior
# Note: semantic-router's `top_k` controls how many utterance vectors are considered
# when scoring routes. For intent routing, we keep it relatively high to avoid
# missing relevant utterances as the config grows.
top_k = 50
# semantic-router native aggregation: "mean" | "max" | "sum"
aggregation = "max"

[intent_router.topic_stack]
# Session-scoped derived state kept in Redis; rebuilt from the latest N user messages on cache miss.
enabled = true
redis_ttl_seconds = 259200 # 3 days
max_user_messages = 10
max_topics = 6
sample_keep = 3

# Topic decisions are cosine-similarity based on topic centroids.
same_topic_threshold = 0.75
return_to_topic_threshold = 0.82

# How much history to send to the LLM when generating answers.
# - "topic_scoped": include only turns aligned to the selected topic
# - "full": include the full session history_text
history_mode = "topic_scoped"

[intent_router.embedding]
# provider: "qwen_local" | "openai_compat"
provider = "qwen_local"

[intent_router.embedding.qwen_local]
model_name = "${INTENT_QWEN_EMBEDDING_MODEL_NAME}"
device = "${INTENT_EMBEDDING_DEVICE}"
cache_folder = "${INTENT_EMBEDDING_CACHE_FOLDER}"
use_china_mirror = false
sentence_transformer_model_kwargs = { low_cpu_mem_usage = true, torch_dtype = "float16" }
encode_kwargs = { show_progress_bar = false }

# Advanced SentenceTransformer knobs (optional).
# These values are passed through to `SentenceTransformer(...)` and `SentenceTransformer.encode(...)`.
# Note:
# - `sentence_transformer_model_kwargs` maps to `SentenceTransformer(..., model_kwargs=...)` (Transformers kwargs).
# You can extend them as needed, e.g.:
# encode_kwargs = { show_progress_bar = false, batch_size = 32 }

[intent_router.embedding.openai_compat]
model_name = "${INTENT_OPENAI_EMBEDDING_MODEL}"
api_key = "${INTENT_EMBEDDING_API_KEY}"
base_url = "${INTENT_EMBEDDING_API_BASE_URL}"
timeout_seconds = 20
max_retries = 0
request_batch_size = 64
supports_batch_input = true

# --------------------
# Intent definitions
# Each intent route:
# - name: stable identifier used by the application
# - action: "rag" | "web_only" | "no_retrieval"
# - threshold: minimum similarity to consider the intent matched
# - utterances: semantic examples to match

[[intent_router.intents]]
name = "RAG_REQUIRED"
action = "rag"
threshold = 0.50
