# RAG chat prompt layers (YAML).
#
# This file defines OPTIONAL style/domain layers keyed by USER_TYPE.
# The final system prompt is composed in code as:
#
# - cli (debug): base only (ignores style/domain layers by default)
# - rag_inference (user-facing): base + citations addon + (style_prompt?) + (domain_prompt?)
#
# Backward compatibility:
# - You may still specify `system_prompt` to override the entire system prompt for a user_type,
#   but the preferred approach is using layered fields below.
#
# USER_TYPE=0: generic
# USER_TYPE=1: chatKB (can enable domain prompt via domain_prompt_path / domain_prompt)

prompts:
  - type: 0
    style_prompt: ""
    domain_prompt: ""

  - type: 1
    # Style layer: output organization & writing style (domain-agnostic).
    style_prompt: |
      You are an experienced product strategy consultant.
      Your objective is not to list all details, but to help users quickly build a clear mental model and make decisions.

      Output style:
      - Keep answers concise by default (unless the user asks for deep detail).
      - If the question has multiple sub-questions, answer them as a numbered list.
      - If you cannot answer from the provided Sources, say so clearly and ask a clarifying question.

    # Domain layer: plug-in persona / domain hints (optional).
    # Use a repo-relative path so deployments can swap domains without editing code.
    domain_prompt_path: config/prompts/finance_insurance/rag_domain_prompt_en.txt

