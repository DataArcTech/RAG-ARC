# Finance/Insurance KG Schema (optional)
#
# Usage:
# - Default (open-source): keep `KG_SCHEMA_PATH=./kg_schema.yml` (general-domain, permissive).
# - Finance/Insurance deployments: set `KG_SCHEMA_PATH=./fin_kg_schema.yml` to enable stricter predicate governance.
#
# Notes:
# - This schema is consumed by the Neo4j HippoRAG store during indexing. It does NOT apply to the igraph store.
# - Keep this file relatively small and maintainable; grow it via domain eval + regression, not ad-hoc additions.

version: v1
default_domain: finance_insurance

domains:
  # Keep a permissive fallback domain so mixed-domain corpora can still be ingested
  # when a chunk/document explicitly sets `domain=default`.
  default:
    entity_aliases: {}
    entity_suffixes_to_strip: []
    allowed_relations: []
    relation_aliases:
      "located in": LOCATED_IN
      "is located in": LOCATED_IN
      "based in": LOCATED_IN
      "owns": OWNS
      "owned by": OWNED_BY
      "part of": PART_OF
      "has part": HAS_PART
      "works for": WORKS_FOR
      "employs": EMPLOYS
      "supplies": SUPPLIES
      "produces": PRODUCES
      "uses": USES
      "has feature": HAS_FEATURE
      "has clause": HAS_CLAUSE
      "has policy": HAS_POLICY
      "has coverage": HAS_COVERAGE
      "has benefit": HAS_BENEFIT
    unknown_predicate_policy: keep
    unknown_predicate_fallback: RELATED_TO
    direction_policy: blacklist
    direction_insensitive_relations:
      - RELATED_TO

  finance_insurance:
    # Entity canonicalization helpers (used to populate `entity_canonical_name/key`).
    # Add project-specific aliases via downstream config management rather than hard-coding here.
    entity_aliases: {}
    entity_suffixes_to_strip:
      - 股份有限公司
      - 有限公司
      - 有限责任公司
      - 集团
      - 分公司
      - 支公司
      - 总公司
      - 公司
      - 分行
      - 支行
      - 银行
      - 保险公司
      - 保险股份有限公司
      - 保险有限责任公司
      - 证券股份有限公司
      - 证券有限公司
      - 信托有限公司
      - 基金管理有限公司
      - corp
      - inc
      - ltd
      - limited
      - plc
      - incorporated
      - company
      - co
      - llc

    # Strict predicate governance for finance/insurance QA:
    # - Unknown predicates are rejected to avoid predicate explosion and ensure deterministic tools can be reused.
    allowed_relations:
      - LOCATED_IN
      - OWNS
      - OWNED_BY
      - PARENT_OF
      - SUBSIDIARY_OF
      - ACQUIRED
      - ACQUIRED_BY
      - INVESTS_IN
      - INVESTED_BY
      - GUARANTEES
      - GUARANTEED_BY
      - ISSUES
      - ISSUED_BY
      - UNDERWRITES
      - UNDERWRITTEN_BY
      - HAS_POLICY
      - HAS_CLAUSE
      - HAS_COVERAGE
      - HAS_BENEFIT
      - HAS_FEATURE
      - HAS_CURRENCY
      - HAS_INTEREST_RATE
      - HAS_REFUND
      - HAS_CASH_VALUE
      - HAS_SURRENDER_VALUE
      - HAS_PAYMENT_MODE
      - HAS_PREMIUM_PAYMENT_TERM
      - HAS_EXCLUSION
      - HAS_WAITING_PERIOD
      - HAS_DEDUCTIBLE
      - HAS_SUM_INSURED
      - HAS_PREMIUM
      - HAS_TERM
      - HAS_LIMIT
      - APPLIES_TO
      - EXCLUDES
      - REQUIRES
      - EFFECTIVE_FROM
      - EFFECTIVE_TO
      - UPDATED_ON
      - RELATED_TO

    # Raw predicate text -> canonical predicate.
    # Keys are matched after `text_processing` (lowercase + strip punctuation).
    relation_aliases:
      # Ownership / corporate structure
      "控股": OWNS
      "持股": OWNS
      "持有": OWNS
      "拥有": OWNS
      "隶属于": SUBSIDIARY_OF
      "子公司": SUBSIDIARY_OF
      "母公司": PARENT_OF
      "收购": ACQUIRED
      "被收购": ACQUIRED_BY
      "投资": INVESTS_IN
      "被投资": INVESTED_BY

      # Insurance contract semantics (high-level)
      "保单": HAS_POLICY
      "条款": HAS_CLAUSE
      "保障": HAS_COVERAGE
      "保险责任": HAS_COVERAGE
      "责任": HAS_COVERAGE
      "给付": HAS_BENEFIT
      "保险金": HAS_BENEFIT
      "功能": HAS_FEATURE
      "特性": HAS_FEATURE
      "除外": HAS_EXCLUSION
      "除外责任": HAS_EXCLUSION
      "免责": HAS_EXCLUSION
      "等待期": HAS_WAITING_PERIOD
      "免赔": HAS_DEDUCTIBLE
      "免赔额": HAS_DEDUCTIBLE
      "保额": HAS_SUM_INSURED
      "保险金额": HAS_SUM_INSURED
      "保费": HAS_PREMIUM
      "保险费": HAS_PREMIUM
      "期限": HAS_TERM
      "期间": HAS_TERM
      "限额": HAS_LIMIT
      "适用": APPLIES_TO
      "不适用": EXCLUDES
      "排除": EXCLUDES
      "要求": REQUIRES

      # Insurance contract semantics (English; normalized by text_processing)
      "policy": HAS_POLICY
      "policy name": HAS_POLICY
      "product": HAS_POLICY
      "plan": HAS_POLICY
      "has policy": HAS_POLICY
      "clause": HAS_CLAUSE
      "policy clause": HAS_CLAUSE
      "has clause": HAS_CLAUSE
      "coverage": HAS_COVERAGE
      "covered": HAS_COVERAGE
      "has coverage": HAS_COVERAGE
      "benefit": HAS_BENEFIT
      "death benefit": HAS_BENEFIT
      "has benefit": HAS_BENEFIT
      "exclusion": HAS_EXCLUSION
      "excluded": HAS_EXCLUSION
      "has exclusion": HAS_EXCLUSION
      "waiting period": HAS_WAITING_PERIOD
      "has waiting period": HAS_WAITING_PERIOD
      "deductible": HAS_DEDUCTIBLE
      "has deductible": HAS_DEDUCTIBLE
      "sum insured": HAS_SUM_INSURED
      "sum assured": HAS_SUM_INSURED
      "insured amount": HAS_SUM_INSURED
      "sum insured amount": HAS_SUM_INSURED
      "has sum insured": HAS_SUM_INSURED
      "premium": HAS_PREMIUM
      "has premium": HAS_PREMIUM
      "policy term": HAS_TERM
      "term": HAS_TERM
      "has term": HAS_TERM
      "limit": HAS_LIMIT
      "has limit": HAS_LIMIT
      "applies to": APPLIES_TO
      "exclude": EXCLUDES
      "excludes": EXCLUDES
      "require": REQUIRES
      "requires": REQUIRES

      # Product attributes & options (English; HK savings insurance product brochures)
      "feature": HAS_FEATURE
      "features": HAS_FEATURE
      "has feature": HAS_FEATURE
      "offer": HAS_FEATURE
      "offers": HAS_FEATURE
      "provide": HAS_FEATURE
      "provides": HAS_FEATURE
      "enable": HAS_FEATURE
      "enables": HAS_FEATURE
      "allow": HAS_FEATURE
      "allows": HAS_FEATURE
      "include": HAS_FEATURE
      "includes": HAS_FEATURE
      "policy currency": HAS_CURRENCY
      "currency": HAS_CURRENCY
      "has currency": HAS_CURRENCY
      "interest rate": HAS_INTEREST_RATE
      "guaranteed preferential interest rate": HAS_INTEREST_RATE
      "has interest rate": HAS_INTEREST_RATE
      "premium refund": HAS_REFUND
      "refund": HAS_REFUND
      "has refund": HAS_REFUND
      "cash value": HAS_CASH_VALUE
      "total cash value": HAS_CASH_VALUE
      "projected total cash value": HAS_CASH_VALUE
      "has cash value": HAS_CASH_VALUE
      "surrender value": HAS_SURRENDER_VALUE
      "has surrender value": HAS_SURRENDER_VALUE
      "payment mode": HAS_PAYMENT_MODE
      "annual payment mode": HAS_PAYMENT_MODE
      "has payment mode": HAS_PAYMENT_MODE
      "premium payment term": HAS_PREMIUM_PAYMENT_TERM
      "has premium payment term": HAS_PREMIUM_PAYMENT_TERM

      # HK savings insurance brochure fields (broader coverage; normalize into existing contract)
      "death benefit": HAS_BENEFIT
      "death benefit settlement option": HAS_FEATURE
      "death benefit settlement": HAS_FEATURE
      "surrender benefit": HAS_BENEFIT
      "reversionary bonus": HAS_BENEFIT
      "terminal bonus": HAS_BENEFIT
      "basic terminal bonus": HAS_BENEFIT
      "extra terminal bonus": HAS_BENEFIT
      "compassionate benefit": HAS_BENEFIT
      "policy loan": HAS_FEATURE
      "automatic premium loan": HAS_FEATURE
      "designated withdrawal": HAS_FEATURE
      "prevailing interest rate": HAS_INTEREST_RATE
      "non guaranteed interest rate": HAS_INTEREST_RATE
      "non-guaranteed interest rate": HAS_INTEREST_RATE

      # Temporal (best-effort, still prefer edge properties valid_from/effective_date)
      "生效": EFFECTIVE_FROM
      "生效日": EFFECTIVE_FROM
      "有效期": EFFECTIVE_TO
      "更新于": UPDATED_ON
      "effective date": EFFECTIVE_FROM
      "valid from": EFFECTIVE_FROM
      "valid to": EFFECTIVE_TO
      "updated on": UPDATED_ON

      # Misc
      "located in": LOCATED_IN
      "based in": LOCATED_IN
      "owns": OWNS
      "owned by": OWNED_BY

    unknown_predicate_policy: reject
    unknown_predicate_fallback: RELATED_TO

    # Direction semantics:
    # Use blacklist so most predicates are treated as direction-sensitive unless explicitly listed.
    direction_policy: blacklist
    direction_insensitive_relations:
      - RELATED_TO
